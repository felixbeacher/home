  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,select,textarea')) return; if (e.key === 'm' || e.key === 'M') { e.preventDefault(); if (blocked()) return; setOn(!on); save(); } });
  // test hooks
  window.__music = {
    get ctx() { return ctx; }, get on() { return on; },
    async renderOffline(secs, impactAt) {
      const oc = new OfflineAudioContext(2, Math.floor(44100 * secs), 44100), g = oc.createGain(); g.gain.value = 0.6;
      g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(0.6, 2); g.connect(oc.destination);
      const e = build(oc, g); e.scheduleUntil(secs); if (impactAt) e.impact(impactAt);
      const b = await oc.startRendering(); return [Array.from(b.getChannelData(0)), Array.from(b.getChannelData(1))];
    },
  };
})();
